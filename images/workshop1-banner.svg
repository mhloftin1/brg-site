<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:wght@400;600&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" fill="#132F4A"/>

  <!-- Amber left stripe -->
  <rect width="4" height="200" fill="#C4873B"/>

  <!-- Large ghosted W1 watermark -->
  <text x="700" y="205" font-family="DM Serif Display, Georgia, serif" font-size="210" fill="#1F4E79" opacity="0.4">W1</text>

  <!-- Eyebrow -->
  <text x="36" y="72" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="600" fill="#C4873B" letter-spacing="2.5" text-anchor="start">BOWIE RESEARCH GROUP · WORKSHOP SERIES</text>

  <!-- Main title -->
  <text x="36" y="122" font-family="DM Serif Display, Georgia, serif" font-size="56" fill="#FFFFFF">How to AI</text>

  <!-- Subtitle -->
  <text x="36" y="148" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.45)" font-weight="400">Workshop 1 of 3 — Working Session</text>

  <!-- Divider line -->
  <line x1="36" y1="163" x2="824" y2="163" stroke="rgba(255,255,255,0.12)" stroke-width="0.75"/>

  <!-- Meta row -->
  <text x="36" y="178" font-family="DM Sans, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C4873B" letter-spacing="1.5">FORMAT</text>
  <text x="36" y="192" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">Half-Day Working Session</text>

  <text x="210" y="178" font-family="DM Sans, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C4873B" letter-spacing="1.5">LOCATION</text>
  <text x="210" y="192" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">The Amarillo Club</text>

  <text x="384" y="178" font-family="DM Sans, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C4873B" letter-spacing="1.5">BRING</text>
  <text x="384" y="192" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">Laptop + Your Questions</text>

  <text x="558" y="178" font-family="DM Sans, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C4873B" letter-spacing="1.5">ENDS WITH</text>
  <text x="558" y="192" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">Lunch</text>
</svg>
